[workspace]
resolver = "2"
members = [
    "crates/vfs",
    "crates/vfs-remote",
    "crates/transfer",
    "crates/sync",
    "crates/config",
    "crates/preview",
    "crates/ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Manifold Contributors"]
description = "Manifold — Cross-Platform Dual-Pane File Manager & Transfer Engine"

[workspace.dependencies]
anyhow = "1.0.104"
bitflags = "2.13.2"
clap = { version = "4.6.7", features = ["derive"] }
fastrand = "2.5.0"
fontique = { version = "0.11.1", features = ["fontconfig-dlopen"] }
heck = "0.5.0"
indexmap = { version = "2.14.2", features = ["serde"] }
libc = "0.2.191"
log = "0.4.34"
memchr = "2.8.3"
once_cell = "1.21.4"
percent-encoding = "2.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
slint = { version = "1.8.0", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software"] }
smallvec = "1.16.3"
tempfile = "3.27.0"
thiserror = "1.0.69"
toml = "0.8.23"
url = "2.5.8"

manifold-vfs = { path = "crates/vfs" }
manifold-vfs-remote = { path = "crates/vfs-remote" }
manifold-transfer = { path = "crates/transfer" }
manifold-sync = { path = "crates/sync" }
manifold-config = { path = "crates/config" }
manifold-preview = { path = "crates/preview" }
manifold-ui = { path = "crates/ui" }

[package]
name = "manifold"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true

[[bin]]
name = "manifold"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
manifold-vfs.workspace = true
manifold-vfs-remote.workspace = true
manifold-transfer.workspace = true
manifold-sync.workspace = true
manifold-config.workspace = true
manifold-preview.workspace = true
manifold-ui.workspace = true

[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.release]
debug = false
incremental = false

[profile.release.build-override]
opt-level = 0
debug = false

[profile.release.package.manifold-ui]
opt-level = 1
codegen-units = 256


